# proxy-farm-9router — konfigurasi bot

[database]
path = "/home/zzdree/.9router/db/data.sqlite"
backup_dir = "backups"
keep_backups = 10

[farm]
max_candidates = 8000
concurrency = 250
connect_timeout = 4.0

# Uji satu proxy sungguhan. Endpoint memakai HTTP, bukan HTTPS: proxy HTTP
# biasa tidak bisa melakukan CONNECT TLS, jadi HTTPS selalu gagal dengan
# WRONG_VERSION_NUMBER walau proxynya sehat.
#
# Cuma SATU endpoint yang dipakai. Setiap proxy yang mati akan habis
# timeout penuh per endpoint, jadi 3 endpoint berarti proxy mati menelan
# 3x waktu — itu yang membuat recheck ribuan baris jadi berjam-jam.
# Satu endpoint cukup: kalau yang ini tidak bisa dihubungi, proxy sudah
# tidak layak.
exit_ip_endpoints = ["http://api.ipify.org"]
# Berapa proxy tercepat yang diuji mendalam (exit-IP). Membatasi beban
# ke endpoint uji dan mengganti uji mendalam dengan uji TCP untuk sisanya.
deep_test_top_n = 800
deep_test_timeout = 6.0

# Proxy yang gagal uji: beri tenggat (strike) sebelum dihapus, karena
# proxy gratis memang flaky. 2 = salah pada 2 run berturut-turut baru dibuang.
grace_strikes = 2

[test]
mode = "deep"          # deep = TCP + exit-IP (untuk tercepat); tcp = TCP saja

[scope]
# RUANG AMAN: vercel & cloudflare TIDAK PERNAH disentuh (read-only).
# Semua recheck/prune hanya berlaku pada type=http (custom + hasil farm).
recheck_types = ["http"]
prune_types = ["http"]
# Hanya baris bertanda `importedSource` (milik tool) yang boleh dihapus.
# Baris custom pertamamu yang tak bertanda itu dipertahankan.
only_prune_owned = true

[order]
# Susunan daftar di dashboard: custom (paling atas) -> vercel -> cloudflare
groups = ["http", "vercel", "cloudflare"]
